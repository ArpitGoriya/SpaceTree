[workspace]
resolver = "2"
members = ["crates/st-core", "crates/st-scan", "crates/st-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ArpitGoriya/SpaceTree"

[workspace.dependencies]
st-core = { path = "crates/st-core" }
st-scan = { path = "crates/st-scan" }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# `tauri dev` builds the Rust side in debug. Fully unoptimized, a scan of a
# large drive spends most of its time in allocation and per-entry bookkeeping
# that the optimizer would otherwise erase, which made dev builds misleadingly
# slow to benchmark. opt-level 1 keeps debug builds quick to compile while
# removing the worst of that; dependencies get 2 since they're compiled once
# and rarely stepped through.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
